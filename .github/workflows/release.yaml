name: Release

on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. snapsec-sensor/v4.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Extract agent name and version
        id: extract
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          AGENT="${REF%%/*}"
          VERSION="${REF#*/}"

          if [ -z "$AGENT" ] || [ -z "$VERSION" ] || [ "$AGENT" = "$VERSION" ]; then
            echo "::error::Tag '$REF' does not match pattern '<agent>/v<version>'"
            exit 1
          fi

          if [ ! -d "$AGENT" ]; then
            echo "::error::Agent directory '$AGENT' does not exist."
            exit 1
          fi

          echo "AGENT=$AGENT" >> $GITHUB_ENV
          echo "GORELEASER_CURRENT_TAG=$VERSION" >> $GITHUB_ENV

          # Force create/update local tag so GoReleaser's commit validation passes
          git tag -f "$VERSION"

      - uses: goreleaser/goreleaser-action@v6
        with:
          workdir: ${{ env.AGENT }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.GORELEASER_CURRENT_TAG }}
